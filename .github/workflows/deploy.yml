name: Build and Deploy Next.js to S3

# main ブランチに push されたときに自動実行
on:
  push:
    branches:
      - main

# 環境変数
env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  BUCKET: ${{ secrets.S3_BUCKET }}
  DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        # タグ一覧URL：https://github.com/actions/checkout/tags
        uses: actions/checkout@v7.0.1

      - name: setup-node
        # タグ一覧URL：https://github.com/actions/setup-node/tags
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Next.js アプリをビルド
      - name: Build
        run: npm run build

      # AWS 認証情報の設定
      - name: configure-aws-credentials
        # タグ一覧URL：https://github.com/aws-actions/configure-aws-credentials/tags
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # S3 に静的ファイルをアップロード
      - name: Upload to S3
        run: aws s3 sync out/ s3://${{ env.BUCKET }} --delete

      # CloudFront キャッシュの無効化
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.DISTRIBUTION_ID }} \
            --paths "/*"
